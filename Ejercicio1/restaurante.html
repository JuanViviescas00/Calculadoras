<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Final</title>
</head>
<body>
    
    <h1 id="titulo">Cuenta Final</h1>
    <div id="caja">
        <h2>Subtotal</h2>
        <label for="subtotal"></label>
        <input type="number " id="subtotal" placeholder="Escribe el subtotal">
        <div id="descuentos">
        <h3>Escoge el tipo de descuento:</h3>
        <p>
        <input type="radio" name="socio" id="no-socio" value="0">
        <label for="radio">No socio: 0%</label>
        </p>
        <p>
            <input type="radio" name="socio" id="socio-estandar" value="5">
        <label for="radio">Socio estandar: 5%</label>
        </p>
        <p>
            <input type="radio" name="socio" id="socio-premium" value="10">
        <label for="radio">Socio premium: 10%</label>
        </p>
        </div>
        <div id="cajatotal">
            <h2 id="res">Total a pagar</h3>
            <h3 id="iva"></h3>
            <h3 id="descuento"></h3>
            <h3 id="propina"></h3>
            <h2 id="Total"></h3>
                
        </div>
        <button onclick="calculartotal()">Calcular</button>
    </div>


    <script>
        let subtotal = document.getElementById("subtotal")
        let total = document.getElementById("Total")
        let radios = document.getElementsByName("socio")
        let descuento = document.getElementById("descuento")
        let iva = document.getElementById("iva")
        let propina = document.getElementById("propina")

        function calculartotal(){
            let desc = 0
            for (let i = 0; i < radios.length; i++) {
                if(radios[i].checked){
                    desc = parseFloat(radios[i].value)
                }
            }
            let cuenta = subtotal.value
            let propinaTotal = cuenta * 0.1
            let ivaTotal = cuenta * 0.11
            let descuentoTotal = (cuenta * desc) / 100
            let totalPagar = parseFloat(cuenta) + ivaTotal + propinaTotal - descuentoTotal

            propina.textContent = "Propina (10%): $"+propinaTotal.toFixed(2)
            iva.textContent = "IVA (11%): $"+ivaTotal.toFixed(2)
            descuento.textContent = "Descuento ("+desc+"%): $"+descuentoTotal.toFixed(2)

            total.textContent = "Total a pagar: $"+totalPagar.toFixed(2)
            

        }
    </script>


<style>

body{

    font-family: Arial, Helvetica, sans-serif;
    background-color: aliceblue;
    }

    #caja{
        border: 2px solid black;
        padding: 20px;
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: auto;
        border-radius: 20px;
        background-color: white;
    }

    #titulo{
        text-align: center;
    }

    #descuentos{
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        gap: 5px;
    }

    #descuentos input{
        margin-left: 10px;
        padding: 10px;
        
    }

    button{
        padding: 10px;
        border: 2px solid green;
        border-radius: 10px;
        background-color: rgb(123, 240, 123);
        font-weight: bold;
        cursor: pointer;
    }

    #subtotal{
        padding: 5px;
        border: 2px solid gray;
        border-radius: 5px;
        margin: 0;
    }
</style>
</body>
</html>
